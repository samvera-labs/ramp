name: Publish and Release library

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: write # Required to create the release and attach dist/ files

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    # Use GitHub environments for deployment protection
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Never use caching in release builds
      # Check if the bundled npm version in Node is >=11.15.0 to support 'npm stage'
      - name: Verify bundled npm version >=11.15.0
        run: |
          NPM_CLI_VERSION="$(npm --version)"
          echo "Node $(node --version), npm ${NPM_CLI_VERSION}"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error(`npm ${process.argv[1]} is too old for "npm stage publish" (needs >=11.15.0). Bump .nvmrc to a Node release bundling a newer npm.`);
              process.exit(1);
            }
          ' "${NPM_CLI_VERSION}"
      # Pins Yarn to the "packageManager" version in package.json
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies (locked)
        run: yarn install --frozen-lockfile
      - name: Build library
        run: yarn build
      - name: Verify build output
        run: |
          test -f dist/ramp.cjs.js
          test -f dist/ramp.esm.js
          test -f dist/ramp.umd.js
          test -f dist/ramp.standalone.umd.js
          test -f dist/ramp.css
          test -n "$(ls -A dist/lang/*.js 2>/dev/null)"
      - name: Stage library for publish
        run: npm stage publish --provenance --access public

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.js
            dist/*.css
            package.json
            README.md
